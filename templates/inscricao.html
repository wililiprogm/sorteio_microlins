{% extends "base.html" %}
{% block titulo %}Sorteio: Fone de Ouvido + Curso Gratuito{% endblock %}
{% block conteudo %}
  <h1>🎧 Sorteio: Fone de Ouvido<br>+ Curso Gratuito</h1>
  <p class="subtitulo">Montagem e Manutenção de Computadores</p>

  <form method="post">
    <label for="nome">Nome do aluno</label>
    <input type="text" id="nome" name="nome" required>

    <label for="telefone">Telefone (com DDD)</label>
    <input type="tel" id="telefone" name="telefone" required>

    <button type="submit">Confirmar inscrição</button>
  </form>

  <div class="rodape"><a href="{{ url_for('admin_login') }}">Área do professor</a></div>
{% endblock %}
