{% extends "base.html" %}
{% block titulo %}Área do professor{% endblock %}
{% block conteudo %}
  <h1>Área do professor</h1>
  <p class="subtitulo">Digite a senha para ver os inscritos e sortear</p>

  <form method="post">
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required>
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
